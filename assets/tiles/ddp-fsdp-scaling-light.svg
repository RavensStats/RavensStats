<svg xmlns="http://www.w3.org/2000/svg" width="410" height="200" viewBox="0 0 410 200" role="img" aria-labelledby="t d"><title id="t">DDP vs FSDP scaling</title><desc id="d">Animation: lines draw peak memory per GPU against model size from 0.5B to 7B on four A100 GPUs for DDP, FSDP ZeRO-2 and FSDP ZeRO-3. DDP reaches 65 GiB at 3B and runs out of the 80 GB at 7B, while ZeRO-2 and ZeRO-3 train 7B at 54 and 42 GiB. A side bar shows that about 91 % of NCCL time overlaps with compute in a profiled 7B ZeRO-3 step. Drawn from the demo's real measurements.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="409" height="199" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><clipPath id="vz"><rect x="1" y="1" width="408" height="145" rx="13"/></clipPath><g clip-path="url(#vz)"><text x="14" y="18" class="m" font-size="9" fill="#59636e">peak GiB per GPU vs model size</text><line x1="30" y1="124" x2="236" y2="124" stroke="#d0d7de"/><line x1="30" y1="48" x2="236" y2="48" stroke="#cf222e" stroke-dasharray="3 3" stroke-opacity=".7"/><text x="32" y="58" class="m" font-size="8" fill="#cf222e">80 GB GPU</text><text x="40" y="137" class="m" font-size="9" fill="#59636e" text-anchor="middle">0.5B</text><text x="102" y="137" class="m" font-size="9" fill="#59636e" text-anchor="middle">1.5B</text><text x="164" y="137" class="m" font-size="9" fill="#59636e" text-anchor="middle">3B</text><text x="226" y="137" class="m" font-size="9" fill="#59636e" text-anchor="middle">7B</text><path d="M40 102.2 L102 78.9 L164 62.2" fill="none" stroke="#0969da" stroke-width="2" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="9s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.04;.4;.94;1"/></path><circle cx="40" cy="102.2" r="2.6" fill="#0969da"/><circle cx="102" cy="78.9" r="2.6" fill="#0969da"/><circle cx="164" cy="62.2" r="2.6" fill="#0969da"/><path d="M40 108.7 L102 98.3 L164 100.6 L226 72.5" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="9s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.04;.4;.94;1"/></path><circle cx="40" cy="108.7" r="2.6" fill="#1a7f37"/><circle cx="102" cy="98.3" r="2.6" fill="#1a7f37"/><circle cx="164" cy="100.6" r="2.6" fill="#1a7f37"/><circle cx="226" cy="72.5" r="2.6" fill="#1a7f37"/><path d="M40 109.3 L102 100.6 L164 105.6 L226 84.1" fill="none" stroke="#8250df" stroke-width="2" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="9s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.04;.4;.94;1"/></path><circle cx="40" cy="109.3" r="2.6" fill="#8250df"/><circle cx="102" cy="100.6" r="2.6" fill="#8250df"/><circle cx="164" cy="105.6" r="2.6" fill="#8250df"/><circle cx="226" cy="84.1" r="2.6" fill="#8250df"/><path d="M221 49 l10 10 m0 -10 l-10 10" stroke="#0969da" stroke-width="2.2" fill="none"/><text x="218" y="68" class="m" font-size="8.5" fill="#0969da" font-weight="600" text-anchor="end">DDP: OOM</text><rect x="20" y="26" width="7" height="7" rx="2" fill="#0969da"/><text x="30" y="33" class="m" font-size="8.5" fill="#1f2328">DDP</text><rect x="78" y="26" width="7" height="7" rx="2" fill="#1a7f37"/><text x="88" y="33" class="m" font-size="8.5" fill="#1f2328">ZeRO-2</text><rect x="136" y="26" width="7" height="7" rx="2" fill="#8250df"/><text x="146" y="33" class="m" font-size="8.5" fill="#1f2328">ZeRO-3</text><text x="262" y="50" class="m" font-size="9" fill="#59636e">7B ZeRO-3, NCCL time</text><text x="262" y="62" class="m" font-size="8" fill="#59636e">(profiler, 3 steps)</text><rect x="262" y="72" width="128" height="14" rx="3" fill="#e8ecf0"/><rect x="262" y="72" width="95" height="14" rx="3" fill="#8250df" fill-opacity=".85"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;95;95;0" keyTimes="0;.4;.6;.94;1"/></rect><rect x="357" y="72" width="9.4" height="14" fill="#bf8700" fill-opacity=".9"/><text x="262" y="100" class="m" font-size="9" fill="#1f2328">41 % of step is NCCL;</text><text x="262" y="112" class="m" font-size="9" fill="#1f2328">91 % overlapped with compute</text><text x="262" y="128" class="m" font-size="8" fill="#59636e">NVLink only; PCIe arm not run</text></g><line x1="1" y1="146" x2="409" y2="146" stroke="#d0d7de"/><text x="18" y="172" class="s" font-size="15" fill="#1f2328" font-weight="700">DDP vs FSDP scaling</text><text x="18" y="190" class="s" font-size="11.5" fill="#59636e">Qwen2.5 0.5B to 7B · 4 GPUs · NCCL</text><rect x="298.4" y="12" width="99.6" height="18" rx="9" fill="#f6f8fa" stroke="#bf8700" stroke-opacity=".6"/><circle cx="308.4" cy="21" r="3" fill="#bf8700"/><text x="315.4" y="25" class="m" font-size="9.5" fill="#bf8700" font-weight="600" letter-spacing=".6">PRIVATE REPO</text></svg>