<svg xmlns="http://www.w3.org/2000/svg" width="410" height="200" viewBox="0 0 410 200" role="img" aria-labelledby="t d"><title id="t">DDP vs FSDP scaling</title><desc id="d">Animation: grouped bars grow for DDP and FSDP throughput at 1, 2 and 4 GPUs (23k to 86k and 87k tokens per second, about 93 % scaling efficiency at 4 GPUs for both), then bars for peak memory per GPU at 4 GPUs (DDP 22.9 GiB, FSDP 15.4 GiB). Drawn from the demo's real measurements on 4 A100 GPUs.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="409" height="199" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><clipPath id="vz"><rect x="1" y="1" width="408" height="145" rx="13"/></clipPath><g clip-path="url(#vz)"><text x="14" y="20" class="m" font-size="9" fill="#59636e">tokens / s, global batch fixed</text><rect x="22" y="95.7" width="24" height="22.3" rx="3" fill="#0969da" fill-opacity=".85"><animate attributeName="height" dur="9s" repeatCount="indefinite" values="0;0;22.3;22.3;0" keyTimes="0;0.04;0.34;.94;1"/><animate attributeName="y" dur="9s" repeatCount="indefinite" values="118;118;95.7;95.7;118" keyTimes="0;0.04;0.34;.94;1"/></rect><rect x="50" y="95.5" width="24" height="22.5" rx="3" fill="#8250df" fill-opacity=".85"><animate attributeName="height" dur="9s" repeatCount="indefinite" values="0;0;22.5;22.5;0" keyTimes="0;0.07;0.37;.94;1"/><animate attributeName="y" dur="9s" repeatCount="indefinite" values="118;118;95.5;95.5;118" keyTimes="0;0.07;0.37;.94;1"/></rect><text x="48" y="132" class="m" font-size="9.5" fill="#59636e" text-anchor="middle">1 GPU</text><rect x="96" y="73.7" width="24" height="44.3" rx="3" fill="#0969da" fill-opacity=".85"><animate attributeName="height" dur="9s" repeatCount="indefinite" values="0;0;44.3;44.3;0" keyTimes="